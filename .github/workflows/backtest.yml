name: Backtest voorspellingsmodel

# Wanneer draait deze workflow?
#  - alleen handmatig via 'Run workflow' in de GitHub UI
#  - geen schedule: backtest is een diagnose-tool, niet een continue taak
#
# Output: een artifact 'backtest-resultaat-<run_id>' dat je kunt downloaden
# vanuit de Actions-pagina. Bevat het markdown-rapport en de ruwe JSON-data.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Aantal dagen testperiode"
        required: false
        default: "30"
        type: string
      horizons:
        description: "Comma-gescheiden horizonten in dagen"
        required: false
        default: "1,3,5,7"
        type: string
      source:
        description: "Prijsbron: archive (meerjarig) / entsoe (recent) / sample"
        required: false
        default: "archive"
        type: choice
        options: ["archive", "entsoe", "sample"]
      end_date:
        description: "Einddatum testperiode YYYY-MM-DD (leeg = gisteren). Voor historische winters/zomers."
        required: false
        default: ""
      bias_mode:
        description: "MOS: off / live (huidige bias_corrections.json, zoals productie) / rolling (v3.2 walk-forward, voor A/B)"
        required: false
        default: "live"
        type: choice
        options: ["off", "live", "rolling"]
      extra_opts:
        description: "Extra backtest-flags, bv: --summer-scarcity --summer-scarcity-scale 1.5, of --scarcity, of --bias-half-life 3"
        required: false
        default: ""
      seasonal:
        description: "Experimentele seizoensfactor aanzetten (archief vorige jaren). Voor A/B-test."
        required: false
        default: false
        type: boolean
      seasonal_years:
        description: "Seizoensfactor: aantal jaren terug (default 3)."
        required: false
        default: "3"
      seasonal_window:
        description: "Seizoensfactor: venster in dagen rond dezelfde datum (default 10)."
        required: false
        default: "10"

permissions:
  contents: read

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backtest
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          mkdir -p backtest-output
          EXTRA=""
          if [ -n "${{ github.event.inputs.source }}" ]; then
            EXTRA="$EXTRA --source ${{ github.event.inputs.source }}"
          fi
          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            EXTRA="$EXTRA --end-date ${{ github.event.inputs.end_date }}"
          fi
          if [ -n "${{ github.event.inputs.bias_mode }}" ]; then
            EXTRA="$EXTRA --bias-mode ${{ github.event.inputs.bias_mode }}"
          fi
          if [ -n "${{ github.event.inputs.extra_opts }}" ]; then
            EXTRA="$EXTRA ${{ github.event.inputs.extra_opts }}"
          fi
          if [ "${{ github.event.inputs.seasonal }}" = "true" ]; then
            EXTRA="$EXTRA --seasonal --seasonal-years ${{ github.event.inputs.seasonal_years }} --seasonal-window ${{ github.event.inputs.seasonal_window }}"
          fi
          python scripts/backtest.py \
            --days "${{ github.event.inputs.days }}" \
            --horizons "${{ github.event.inputs.horizons }}" \
            $EXTRA \
            --output-dir backtest-output

      - name: Print rapport in de logs
        run: |
          echo "::group::Backtest-rapport (markdown)"
          cat backtest-output/backtest-resultaat-v1.md
          echo "::endgroup::"

      - name: Upload backtest-resultaat als artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtest-resultaat-${{ github.run_id }}
          path: backtest-output/
          retention-days: 90

      - name: Genereer job summary
        if: always()
        run: |
          if [ -f backtest-output/backtest-resultaat-v1.md ]; then
            cat backtest-output/backtest-resultaat-v1.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Geen rapport gegenereerd." >> "$GITHUB_STEP_SUMMARY"
          fi
