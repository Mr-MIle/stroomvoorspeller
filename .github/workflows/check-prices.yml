name: Check & update prijzen

# Aangestuurd door Pipedream (elke 15 minuten via workflow_dispatch).
#
# Logica:
#   1. check_new_prices.py controleert of er nieuwe morgen-prijzen zijn die nog niet
#      in prices.json staan (exit 0 = ja, exit 1 = nee/wacht). De check kijkt eerst
#      naar ENTSO-E; heeft die nog niets, dan wordt de EPEX-achtervang
#      (energy-charts.info, geen API-key) bevraagd. Zodra EPEX de volledige dag heeft,
#      draait de pipeline en vult fetch_prices.py morgen via EPEX aan.
#   2. Alleen als de check slaagt: volledige pipeline draaien.
#   3. Als prices.json al up-to-date is: workflow stopt na ~15 seconden.
#
# Pipedream-instelling: POST naar GitHub API elke 15 minuten.
#   ENTSO-E publiceert meestal ~13:00 CEST, maar op gespannen/late dagen pas later.
#   Houd het triggervenster daarom ruim - 9:45-19:00 CEST - zodat een late publicatie
#   (en de EPEX-achtervang) alsnog binnen het venster valt. Buiten dit venster
#   hoef je niet te triggeren.

on:
  workflow_dispatch:  
  schedule:
    - cron: "00 13,14,15,16,17,18 * * *"

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    outputs:
      # 'true' als er nieuwe prijzen zijn gecommit in deze run - gebruikt door de tweet-job.
      nieuwe_prijzen: ${{ steps.commit.outputs.committed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Exit 0 -> nieuwe prijzen beschikbaar.
      # Exit 1 -> al up-to-date of ENTSO-E/EPEX hebben nog niets -> alle volgende stappen
      #           worden overgeslagen via `if: steps.check.outcome == 'success'`.
      - name: Check nieuwe prijzen (ENTSO-E + EPEX-achtervang)
        id: check
        continue-on-error: true
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python scripts/check_new_prices.py

      - name: Haal prijzen op
        if: steps.check.outcome == 'success'
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python scripts/fetch_prices.py

      - name: Genereer voorspelling
        if: steps.check.outcome == 'success'
        continue-on-error: true
        run: python scripts/run_forecast.py

      - name: Vul actuals in prediction log
        if: steps.check.outcome == 'success'
        continue-on-error: true
        run: python scripts/update_log.py

      - name: Archiveer forecast-snapshot
        if: steps.check.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p public/data/forecast_archive
          DATE=$(date -u +%Y-%m-%d)
          cp public/data/forecast.json public/data/forecast_archive/forecast_${DATE}.json

      - name: Genereer RSS-feed
        if: steps.check.outcome == 'success'
        continue-on-error: true
        run: python scripts/generate_feed.py

      - name: Genereer Home Assistant feed
        # Schrijft public/data/ha.json (vandaag + morgen + voorspelling). Zonder deze
        # stap blijft de HA-feed op de ochtendversie staan als deze workflow - en niet
        # update-prices - de morgen-prijzen als eerste publiceert.
        if: steps.check.outcome == 'success'
        continue-on-error: true
        run: python scripts/generate_ha.py

      - name: Genereer prijsduiding
        # Leest ha.json + forecast.json; draait daarom na generate_ha.py.
        if: steps.check.outcome == 'success'
        continue-on-error: true
        run: python scripts/genereer_duiding.py --prod public/data/ha.json public/data/duiding.json public/data/forecast.json

      - name: Genereer performance-dashboard
        if: steps.check.outcome == 'success'
        continue-on-error: true
        run: python scripts/generate_performance.py

      - name: Commit en push als er iets veranderd is
        id: commit
        if: steps.check.outcome == 'success'
        run: |
          git config user.name "stroomvoorspeller-bot"
          git config user.email "bot@stroomvoorspeller.nl"
          git add public/data/prices.json public/data/forecast.json 2>/dev/null || true
          git add public/data/feed.xml 2>/dev/null || true
          git add public/data/ha.json 2>/dev/null || true
          git add public/data/duiding.json 2>/dev/null || true
          git add public/data/performance.json 2>/dev/null || true
          git add public/data/forecast_archive/ 2>/dev/null || true
          git add 03-data/prediction_log.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: update prijzen + voorspelling $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          else
            echo "Geen wijzigingen - niets te committen."
            echo "committed=false" >> $GITHUB_OUTPUT
          fi

  tweet:
    name: Post dagelijkse X-tweet
    needs: check-and-update
    # Alleen draaien als er in deze run daadwerkelijk nieuwe prijzen zijn gecommit.
    # Omdat de check stopt zodra prices.json morgen al heeft (uit ENTSO-E OF EPEX),
    # draait de pipeline maar een keer per dag -> precies een tweet bij de eerste
    # publicatie, en niet opnieuw als ENTSO-E later de EPEX-data nog inhaalt.
    if: needs.check-and-update.outputs.nieuwe_prijzen == 'true'
    uses: ./.github/workflows/daily-tweet.yml
    secrets: inherit
