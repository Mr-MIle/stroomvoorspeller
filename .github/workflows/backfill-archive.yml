name: Backfill historisch prijsarchief

# Handmatig triggeren vanuit de GitHub Actions UI.
# Vul de gewenste datum-range in bij "Run workflow".
on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Startdatum (inclusief) — formaat YYYY-MM-DD'
        required: true
        default: '2026-04-01'
      to_date:
        description: 'Einddatum (inclusief) — formaat YYYY-MM-DD. Leeg = t/m gisteren.'
        required: false
        default: ''

permissions:
  contents: write   # nodig om archief-bestanden terug te committen

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Voer backfill uit
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.to_date }}" ]; then
            python scripts/backfill_archive.py \
              --from "${{ github.event.inputs.from_date }}" \
              --to   "${{ github.event.inputs.to_date }}"
          else
            python scripts/backfill_archive.py \
              --from "${{ github.event.inputs.from_date }}"
          fi

      - name: Commit en push archief-bestanden
        run: |
          git config user.name "stroomvoorspeller-bot"
          git config user.email "bot@stroomvoorspeller.nl"
          git add public/data/archief/
          if ! git diff --cached --quiet; then
            git commit -m "backfill: archief ${{ github.event.inputs.from_date }} t/m ${{ github.event.inputs.to_date || 'gisteren' }}"
            git push
          else
            echo "Geen nieuwe archiefdata — alles was al aanwezig."
          fi
