name: Update prijzen (handmatig / fallback)

# LET OP: de automatische prijs-updates worden aangestuurd door Pipedream via
# check-prices.yml (elke 15 min, slim) en update-forecast.yml (3× per dag).
# Deze workflow is bewaard als handmatige fallback en voor dev-gebruik.
#
# Wanneer draait deze workflow?
#  - na elke push naar main (handig om de cache direct te verversen)
#  - handmatig, via Run workflow in de GitHub UI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # nodig om data terug te committen

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Haal prijzen op
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          python scripts/fetch_prices.py

      - name: Genereer voorspelling
        # Mag falen zonder dat de prijzen-update zelf faalt (continue-on-error).
        # Bij Open-Meteo of Yahoo downtime krijgen bezoekers de actuele day-ahead
        # prijzen wel; alleen de 5-7d voorspelling ontbreekt dan tijdelijk.
        # Schrijft ook 03-data/prediction_log.json (nieuwe entries, actual=null).
        continue-on-error: true
        run: |
          python scripts/run_forecast.py

      - name: Vul actuals in prediction log
        # Zoekt entries in prediction_log.json waar actual==null en de prijs
        # inmiddels beschikbaar is in prices.json. Nodig voor bias-correctie.
        continue-on-error: true
        run: |
          python scripts/update_log.py

      - name: Archiveer forecast-snapshot
        # Slaat dagelijks één kopie van forecast.json op in forecast_archive/.
        # Nodig voor het performance-dashboard (vergelijking voorspelling vs werkelijk).
        # Overschrijft de snapshot van dezelfde dag als de workflow meerdere keren draait —
        # de laatste run van de dag wint, wat acceptabel is.
        continue-on-error: true
        run: |
          mkdir -p public/data/forecast_archive
          DATE=$(date -u +%Y-%m-%d)
          cp public/data/forecast.json public/data/forecast_archive/forecast_${DATE}.json

      - name: Genereer RSS-feed
        # Schrijft public/data/feed.xml met de laatste 7 dagen uurprijzen.
        # Mag falen zonder dat de rest van de workflow stopt.
        continue-on-error: true
        run: |
          python scripts/generate_feed.py

      - name: Genereer performance-dashboard
        # Schrijft public/data/performance.json op basis van gearchiveerde forecasts
        # en werkelijke prijzen. Heeft pas zinvolle output na ~14 dagen archief.
        continue-on-error: true
        run: |
          python scripts/generate_performance.py

      - name: Commit en push als er iets veranderd is
        run: |
          git config user.name "stroomvoorspeller-bot"
          git config user.email "bot@stroomvoorspeller.nl"
          git add public/data/prices.json public/data/forecast.json 2>/dev/null || true
          git add public/data/feed.xml 2>/dev/null || true
          git add public/data/performance.json 2>/dev/null || true
          git add public/data/forecast_archive/ 2>/dev/null || true
          git add 03-data/prediction_log.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "auto: update prijzen + voorspelling $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Geen wijzigingen - niets te committen."
          fi
