name: A/B niveauverschuiving (v3.3, optie 1)

# Draait automatisch bij elke push naar de branch ab/level-shift.
# Reden voor die trigger: workflow_dispatch is niet aanroepbaar vanuit de
# Claude-sandbox (api.github.com geeft daar 403), een push wel.
#
# Zes armen: {control, weight 0.5, weight 1.0} x {zomer 2026, winter 2026}.
# Elke arm draait als eigen matrix-job, schrijft een artifact, en een
# afsluitende job verzamelt alles en commit de rapporten terug naar deze
# branch onder ab-resultaten/. Dat terugcommitten is nodig omdat artifacts
# alleen via de API te downloaden zijn — via git kan ik ze wel lezen.
#
# main wordt hier niet geraakt. De vlag staat in forecast.py default UIT, dus
# ook na een eventuele merge verandert de productievoorspelling niets tot
# run_forecast.py hem expliciet aanzet.

on:
  push:
    branches: [ab/level-shift]
    paths-ignore:
      - 'ab-resultaten/**'

permissions:
  contents: write

concurrency:
  group: ab-level-shift
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Zomer 2026: het regime waar het probleem zit ----
          # ENTSO-E als bron, want het archief loopt maar tot 18 juli 2026.
          - arm: zomer-control
            source: entsoe
            end_date: "2026-08-16"
            days: "60"
            opts: ""
          - arm: zomer-w05
            source: entsoe
            end_date: "2026-08-16"
            days: "60"
            opts: "--level-shift --level-shift-weight 0.5"
          - arm: zomer-w10
            source: entsoe
            end_date: "2026-08-16"
            days: "60"
            opts: "--level-shift --level-shift-weight 1.0"
          # ---- Winter 2026: regressiecheck op het dominante normaal-regime ----
          - arm: winter-control
            source: archive
            end_date: "2026-02-28"
            days: "60"
            opts: ""
          - arm: winter-w05
            source: archive
            end_date: "2026-02-28"
            days: "60"
            opts: "--level-shift --level-shift-weight 0.5"
          - arm: winter-w10
            source: archive
            end_date: "2026-02-28"
            days: "60"
            opts: "--level-shift --level-shift-weight 1.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test forecast.py
        run: python scripts/forecast.py > /dev/null

      - name: Backtest ${{ matrix.arm }}
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: |
          mkdir -p out
          # bias-mode off: beide armen moeten identiek zijn op alles behalve de
          # baseline. Met MOS aan zou een correctie die op het oude model is
          # gefit het verschil vertroebelen.
          python scripts/backtest.py \
            --days "${{ matrix.days }}" \
            --horizons "1,3,5,7" \
            --source "${{ matrix.source }}" \
            --end-date "${{ matrix.end_date }}" \
            --bias-mode off \
            ${{ matrix.opts }} \
            --output-dir out

      - name: Hernoem naar arm
        if: always()
        run: |
          mkdir -p arm
          for f in out/*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            cp "$f" "arm/${{ matrix.arm }}--${base}"
          done
          ls -la arm

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-${{ matrix.arm }}
          path: arm/
          retention-days: 30

  verzamel:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ab/level-shift

      - name: Download alle artifacts
        uses: actions/download-artifact@v4
        with:
          path: gedownload

      - name: Verzamel in ab-resultaten/
        run: |
          mkdir -p ab-resultaten
          find gedownload -type f -exec cp {} ab-resultaten/ \;
          ls -la ab-resultaten
          {
            echo "# A/B niveauverschuiving — run ${{ github.run_id }}"
            echo
            echo "Commit: ${{ github.sha }}"
            echo
            for f in ab-resultaten/*.md; do
              [ -e "$f" ] || continue
              case "$f" in *OVERZICHT.md) continue ;; esac
              echo "## $(basename "$f")"
              echo
              cat "$f"
              echo
            done
          } > ab-resultaten/OVERZICHT.md

      - name: Commit resultaten terug naar de branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ab-resultaten
          if git diff --staged --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "A/B niveauverschuiving: resultaten run ${{ github.run_id }} [skip ci]"
            git push origin HEAD:ab/level-shift
          fi
